name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Smoke test packaged application
        shell: bash
        run: |
          state_dir=$(mktemp -d)
          trap 'rm -rf "$state_dir"' EXIT
          jar=target/counter-su-1.0.0-SNAPSHOT.jar
          printf '/inc\n/inc\n/stop\n' | java -jar "$jar" "$state_dir/counter.txt"
          test "$(cat "$state_dir/counter.txt")" = 2
          printf '/inc\n' | java -jar "$jar" "$state_dir/counter.txt"
          test "$(cat "$state_dir/counter.txt")" = 3
          java -jar "$jar" --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports
